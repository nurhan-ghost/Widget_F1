[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "formula1-widget"
version = "0.1.0"
description = "A compact desktop Formula 1 standings widget"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.10,<7"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16,<7"]

[project.gui-scripts]
f1-widget = "f1widget.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
f1widget = ["assets/*.ico", "assets/fonts/*.ttf", "assets/fonts/*.otf"]
